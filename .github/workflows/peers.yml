name: Two Minecraft clients and dedicated Forge server
on:
  workflow_dispatch:
  push:
    paths: ['src/**','art/runtime.zip','qa/Peer*.java','qa/peers.py','.github/workflows/peers.yml']
permissions:
  contents: read
jobs:
  peers:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle --no-daemon build
      - name: Prepare instrumented clients and dedicated server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          u=https://maven.minecraftforge.net/net/minecraftforge/forge/26.3-66.1.0/forge-26.3-66.1.0
          curl -fsSL --retry 3 "$u-mdk.zip" -o mdk.zip
          unzip -q mdk.zip -d host
          cp qa/Peer*.java host/src/main/java/com/example/examplemod/
          (cd host && gradle --no-daemon build)
          mkdir dedicated
          curl -fsSL --retry 3 "$u-installer.jar" -o installer.jar
          java -jar installer.jar --installServer dedicated
      - name: Test sound and movement synchronization, server damage and mixed group
        run: python3 qa/peers.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-evidence
          path: |
            *.log
            observer/run/screenshots/
            signals/
            build/libs/*.jar


