name: Build Zona Morta
on:
  workflow_dispatch:
  push:
    paths: ['src/**','tools/build_art.py','tools/build_data.py','tools/build_mobs.py','build.gradle','settings.gradle','.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: zona-morta-mc26.3-forge66.1.0
          path: build/libs/zona-*.jar
          if-no-files-found: error

