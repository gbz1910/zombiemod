name: Production dedicated server and world persistence
on:
  workflow_dispatch:
  push:
    paths: ['src/**','art/runtime.zip','qa/dedicated.py','.github/workflows/dedicated.yml']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle --no-daemon build
      - name: Install Forge 66.1.0 into isolated server
        run: |
          mkdir dedicated
          curl -fsSL --retry 3 https://maven.minecraftforge.net/net/minecraftforge/forge/26.3-66.1.0/forge-26.3-66.1.0-installer.jar -o installer.jar
          java -jar installer.jar --installServer dedicated
      - name: Start, save, restart and inspect entities
        run: python3 qa/dedicated.py


